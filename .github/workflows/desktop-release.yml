# Desktop 发布（设计文档 §20 / §21 / §23）：方案 B（内置 Baseline Runtime）+ 签名 + 公证 + 更新清单
# 触发：git tag v<version>，或手动 workflow_dispatch（版本留空自动递增 patch）。
# Updater 签名是发布硬门禁；Apple Developer ID 签名/公证仍按 Secrets 是否配置启用。
name: desktop-release

on:
  workflow_call:
    inputs:
      version:
        description: "可选 Desktop 版本；留空自动递增 patch"
        required: false
        default: ""
        type: string
      runtime_artifact:
        description: "同一次工作流中已通过 Compatibility Gate 的 Runtime Artifact 名称"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本（如 0.2.0）；留空则在最新 vX.Y.Z tag 上自动加一"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    concurrency:
      group: desktop-release
      cancel-in-progress: false
    env:
      # secrets 只能在 env 中引用；step 的 if 使用这些布尔标志
      HAS_CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 != '' }}
      HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # 自动版本需要读取完整 tag；浅克隆可能错误地重复已有版本。
          fetch-depth: 0

      - name: 解析发布版本（手动值优先，空值自动递增 patch）
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version || '' }}
        run: |
          EXTRA_ARGS=()
          # tag 触发时该版本自然已经存在；workflow_dispatch 手动值则必须高于最新 tag。
          if [[ "${{ github.event_name }}" == "push" ]]; then EXTRA_ARGS+=(--allow-existing); fi
          VERSION=$(node updater/scripts/resolve-desktop-version.mjs "$REQUESTED_VERSION" "${EXTRA_ARGS[@]}")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "desktop release version: $VERSION"

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # pnpm 版本须与本地工具链一致（lockfile v9 + allowBuilds 为 pnpm 11 语义）
      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验 Updater 签名密钥
        run: |
          if [[ "$HAS_SIGNING_KEY" != "true" ]]; then
            echo "缺少 TAURI_SIGNING_PRIVATE_KEY，不能生成可供 App 自动更新的 Release" >&2
            exit 1
          fi

      - name: 解析 Baseline Harness 版本
        id: baseline
        if: ${{ inputs.runtime_artifact == '' }}
        run: |
          # tag/手动发布复用 upstream-watch 最后完整发布成功的精确版本。
          HARNESS_VERSION="$(tr -d '[:space:]' < runtime/.known-version)"
          if [[ -z "$HARNESS_VERSION" ]]; then
            echo "runtime/.known-version 为空，无法确定 Baseline Harness 版本" >&2
            exit 1
          fi
          echo "HARNESS_VERSION=$HARNESS_VERSION" >> "$GITHUB_ENV"
          echo "harness_version=$HARNESS_VERSION" >> "$GITHUB_OUTPUT"
          echo "Baseline Harness version: $HARNESS_VERSION"

      # dsh-ui 由 App Bundle 独立携带并在启动时覆盖，因此 UI-only 发布可以复用 Runtime。
      - name: 恢复已验证的 Runtime Cache
        id: runtime-cache
        if: ${{ inputs.runtime_artifact == '' }}
        uses: actions/cache/restore@v6
        with:
          path: runtime/dist
          key: runtime-v2-${{ runner.os }}-arm64-${{ steps.baseline.outputs.harness_version }}-${{ hashFiles('runtime/scripts/**', 'packages/dsh-theme/**', 'packages/dsh-tools/**', 'packages/dsh-integrations/**', 'packages/dsh-desktop-bundle/**') }}

      - name: 下载已验证的 Runtime Artifact
        if: ${{ inputs.runtime_artifact != '' }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.runtime_artifact }}
          path: runtime/dist

      # 只有没有同版本验证缓存时，tag/手动发布才从零安装完整 Harness 依赖树。
      - name: 准备 Baseline Runtime（Cache Miss）
        if: ${{ inputs.runtime_artifact == '' && steps.runtime-cache.outputs.cache-hit != 'true' }}
        env:
          # npm 解析 dsh 的大型依赖图会超过 Node 默认约 2 GB 的 V8 堆上限；
          # macos-14 Runner 有 7 GB 内存，这里仅为该步骤提升至 4 GB。
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          # dsh 基座装到 RUNNER_TEMP（仓库外）。用 npm 而非 pnpm：
          #  - npm 原生执行 postinstall（node-pty/koffi 等原生模块），无 pnpm 审批问题；
          #  - npm 布局是真实目录（无符号链接），runtime zip 更小（~80MB vs pnpm ~450MB）。
          mkdir -p "$RUNNER_TEMP/dsh-base"
          cd "$RUNNER_TEMP/dsh-base"
          printf '{"name":"dsh-base","private":true,"dependencies":{"@deepseek-ai/dsh":"%s"}}\n' \
            "$HARNESS_VERSION" > package.json
          npm install --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"
          OUT=$(DSH_BASE="$RUNNER_TEMP/dsh-base" \
            node runtime/scripts/build-runtime.ts --out runtime/dist)
          echo "$OUT"
        shell: bash

      - name: 校验 Runtime Artifact
        run: |
          ARGS=(--dist runtime/dist)
          if [[ -n "${HARNESS_VERSION:-}" ]]; then
            ARGS+=(--expected-harness "$HARNESS_VERSION" --extract "$RUNNER_TEMP/runtime-cache-verify")
          fi
          node runtime/scripts/prepare-runtime-artifact.ts "${ARGS[@]}" >> "$GITHUB_ENV"

      - name: Compatibility Gate（手动/tag 基线 Runtime 可用性）
        if: ${{ inputs.runtime_artifact == '' }}
        run: node runtime/scripts/verify-runtime.ts --runtime "$STAGING_DIR"

      # actions/cache 的 Key 不可覆盖；仅在 Cache Miss 且 Gate 成功后保存可信三件套。
      - name: 保存已验证的 Runtime Cache
        if: >-
          ${{ github.ref == 'refs/heads/main' && inputs.runtime_artifact == '' &&
          steps.runtime-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: runtime/dist
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      # App 自带 dsh-ui 会覆盖 Runtime 中的副本，因此所有发布入口都必须验证当前仓库版本。
      - name: Desktop UI 行为门（Service 注入 → Slot 注册 → 握手前可见）
        run: node packages/harness-adapter/scripts/verify-ui-logic.ts

      - name: 嵌入已验证的 Baseline Runtime
        run: |
          mkdir -p apps/desktop/src-tauri/resources/baseline
          cp "$RUNTIME_ZIP" apps/desktop/src-tauri/resources/baseline/runtime.zip
          cp "$RUNTIME_MANIFEST" apps/desktop/src-tauri/resources/baseline/manifest.json
          cp "$RUNTIME_SHA_FILE" apps/desktop/src-tauri/resources/baseline/runtime.zip.sha256

      # ---------- 签名与公证 ----------
      - name: 导入 Developer ID 证书到 Keychain
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          P12_B64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          echo "$P12_B64" | base64 --decode > /tmp/developer-id.p12
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security import /tmp/developer-id.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security list-keychains -d user -s build.keychain

      - name: 添加 arm64 交叉编译目标（runner 为 x64）
        run: rustup target add aarch64-apple-darwin

      - name: 恢复 Rust/Tauri 编译缓存
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
            !apps/desktop/src-tauri/target/**/bundle
          # Desktop 版本进入精确 Key，restore-keys 只复用依赖/中间产物，最终 App 必须重新链接。
          key: cargo-v2-${{ runner.os }}-aarch64-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ env.VERSION }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml', 'apps/desktop/src-tauri/build.rs', 'apps/desktop/src-tauri/src/**/*.rs', 'apps/desktop/src-tauri/tauri.conf.json') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-aarch64-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-

      - name: 构建签名 DMG + App（updater 产物 .app.tar.gz）
        env:
          TAURI_SIGNING_IDENTITY: ${{ secrets.TAURI_SIGNING_IDENTITY || 'Developer ID Application' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd apps/desktop
          # 只在构建配置中覆盖版本，避免 Release workflow 自动提交版本文件。
          pnpm tauri build --target aarch64-apple-darwin --config "{\"version\":\"${VERSION}\"}"

      # Tag Cache 彼此隔离且不能被下一版本读取，只在 main 范围保存供所有 tag 恢复。
      - name: 保存 Rust/Tauri 编译缓存
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
            !apps/desktop/src-tauri/target/**/bundle
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: 校验代码签名
        if: ${{ env.HAS_CERT == 'true' }}
        run: |
          APP=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle -name "*.app" -maxdepth 3 | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: 公证（notarytool submit + staple + spctl 门禁）
        if: ${{ env.HAS_APPLE_ID == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          xcrun notarytool submit --wait --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" "$DMG"
          xcrun stapler staple "$DMG"
          spctl -a -vv --type install "$DMG"

      - name: 规范化发布产物名称
        run: |
          DMG=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          APP_TAR=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle -name "*.app.tar.gz" | head -1)
          if [[ -z "$APP_TAR" || ! -s "${APP_TAR}.sig" ]]; then
            echo "缺少 Tauri Updater 的 .app.tar.gz 或 .sig 产物" >&2
            exit 1
          fi
          mkdir -p dist-final
          cp "$DMG" "dist-final/DeepseekDesktop_${VERSION}_arm64.dmg"
          cp "$APP_TAR" "dist-final/DeepseekDesktop_${VERSION}_arm64.app.tar.gz"
          cp "${APP_TAR}.sig" "dist-final/DeepseekDesktop_${VERSION}_arm64.app.tar.gz.sig"

      # ---------- Desktop Update 清单（§18） ----------
      - name: 校验并生成 latest.json
        run: |
          mkdir -p updater/dist
          APP_TAR="dist-final/DeepseekDesktop_${VERSION}_arm64.app.tar.gz"
          SIGNATURE_FILE="${APP_TAR}.sig"
          node updater/scripts/generate-updater-json.ts \
            --version "$VERSION" \
            --url "https://github.com/${{ github.repository }}/releases/download/v$VERSION/$(basename $APP_TAR)" \
            --signature-file "$SIGNATURE_FILE" \
            --out updater/dist/latest.json

      - name: 创建 GitHub Release（DMG + Updater 完整产物）
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: "DeepSeek Harness Desktop v${{ env.VERSION }}"
          files: |
            dist-final/*.dmg
            dist-final/*.app.tar.gz
            dist-final/*.app.tar.gz.sig
            updater/dist/latest.json

      - name: 更新固定的 Desktop Updater 清单入口
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 固定 tag 只承载可覆盖的 latest.json，清单中的二进制仍指向不可变的版本 Release。
          if ! gh release view desktop-updater >/dev/null 2>&1; then
            gh release create desktop-updater \
              --target "$GITHUB_SHA" \
              --title "Desktop Updater Manifest" \
              --notes "Stable manifest endpoint used by the in-app Tauri updater." \
              --prerelease
          fi
          gh release upload desktop-updater updater/dist/latest.json --clobber
