# Runtime 构建 + Compatibility Gate：固定 Harness 版本、捆绑 Extension Pack、构建并验证，
# 随后把同一份产物交给 Desktop Release。只有完整桌面发布成功才推进已知版本。
name: runtime-build

on:
  workflow_dispatch:
    inputs:
      harness_version:
        description: "@deepseek-ai/dsh 版本（如 0.1.0-rc.6，留空则安装 latest）"
        required: false
        default: ""
permissions:
  contents: write

# 同一 Harness 版本只允许一条发布链运行；排队任务会在前一条结束后重新读取
# .known-version，成功版本直接跳过，失败版本则继续重试。
concurrency:
  group: runtime-build-${{ inputs.harness_version || 'latest' }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: 跳过已经完整发布的 Harness 版本
        id: compare
        env:
          REQUESTED_VERSION: ${{ inputs.harness_version }}
        run: |
          KNOWN_VERSION="$(tr -d '[:space:]' < runtime/.known-version)"
          if [[ -n "$REQUESTED_VERSION" && "$REQUESTED_VERSION" == "$KNOWN_VERSION" ]]; then
            echo "Harness $REQUESTED_VERSION 已完成 Desktop Release，跳过重复任务"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-verify:
    needs: preflight
    if: ${{ needs.preflight.outputs.should_build == 'true' }}
    runs-on: macos-14
    outputs:
      harness_version: ${{ steps.resolve-harness.outputs.harness_version }}
    steps:
      # v5 系列使用 Node 24，避免后续 Runtime 构建继续出现 Node 20 弃用警告。
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: 解析精确 Harness 版本
        id: resolve-harness
        env:
          REQUESTED_VERSION: ${{ inputs.harness_version }}
        run: |
          # latest 只在这里解析一次，后续 npm 安装、缓存键和发布确认全部使用同一版本。
          HARNESS_VERSION="$REQUESTED_VERSION"
          if [[ -z "$HARNESS_VERSION" ]]; then
            HARNESS_VERSION="$(npm view @deepseek-ai/dsh version)"
          fi
          if [[ ! "$HARNESS_VERSION" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "Harness 版本格式无效: $HARNESS_VERSION" >&2
            exit 1
          fi
          echo "HARNESS_VERSION=$HARNESS_VERSION" >> "$GITHUB_ENV"
          echo "harness_version=$HARNESS_VERSION" >> "$GITHUB_OUTPUT"
          echo "Harness version: $HARNESS_VERSION"

      # dsh-ui 由 Desktop App Bundle 独立覆盖，不属于 Runtime Cache 的失效条件。
      - name: 恢复已验证的 Runtime Cache
        id: runtime-cache
        uses: actions/cache/restore@v6
        with:
          path: runtime/dist
          key: runtime-v2-${{ runner.os }}-arm64-${{ steps.resolve-harness.outputs.harness_version }}-${{ hashFiles('runtime/scripts/**', 'packages/dsh-theme/**', 'packages/dsh-tools/**', 'packages/dsh-integrations/**', 'packages/dsh-desktop-bundle/**') }}

      - name: 固定 @deepseek-ai/dsh 版本并安装到基座
        if: ${{ steps.runtime-cache.outputs.cache-hit != 'true' }}
        run: |
          # 基座装到 RUNNER_TEMP（仓库外）。用 npm：原生跑 postinstall、真实目录布局、
          # runtime zip 更小（pnpm 布局会得到 ~450MB 且依赖符号链接，zip 默认跟随链接膨胀）
          mkdir -p "$RUNNER_TEMP/dsh-base"
          cd "$RUNNER_TEMP/dsh-base"
          printf '{"name":"dsh-base","private":true,"dependencies":{"@deepseek-ai/dsh":"%s"}}\n' \
            "$HARNESS_VERSION" > package.json
          npm install --no-audit --no-fund
          echo "DSH_BASE_DIR=$RUNNER_TEMP/dsh-base" >> "$GITHUB_ENV"

      - name: 构建 Runtime（zip + sha256 + manifest）
        if: ${{ steps.runtime-cache.outputs.cache-hit != 'true' }}
        run: |
          OUT=$(node runtime/scripts/build-runtime.ts --dsh-base "$DSH_BASE_DIR")
          echo "$OUT"

      - name: 校验 Runtime Artifact 并准备 Compatibility Gate
        run: |
          node runtime/scripts/prepare-runtime-artifact.ts \
            --dist runtime/dist \
            --expected-harness "$HARNESS_VERSION" \
            --extract "$RUNNER_TEMP/runtime-cache-verify" >> "$GITHUB_ENV"

      - name: Desktop UI 行为门（Service 注入 → Slot 注册 → 握手前可见）
        run: node packages/harness-adapter/scripts/verify-ui-logic.ts

      - name: Compatibility Gate（全新 DSH_HOME：扩展加载 → 启动 → 引导图 → client.js）
        run: node runtime/scripts/verify-runtime.ts --runtime "$STAGING_DIR"

      # 只保存已经通过完整 Gate 的三件套；同一 Key 的 Cache 不覆盖，避免并发污染。
      - name: 保存已验证的 Runtime Cache
        if: ${{ github.ref == 'refs/heads/main' && steps.runtime-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: runtime/dist
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: 上传产物（zip + sha256 + manifest）
        uses: actions/upload-artifact@v6
        with:
          name: runtime-dist
          path: |
            runtime/dist/*.zip
            runtime/dist/*.sha256
            runtime/dist/manifest-*.json
          retention-days: 14

  desktop-release:
    needs: build-and-verify
    uses: ./.github/workflows/desktop-release.yml
    with:
      runtime_artifact: runtime-dist
    secrets: inherit

  confirm-upstream-version:
    needs: [build-and-verify, desktop-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Desktop Release 成功后推进已知 Harness 版本
        run: |
          # 最后写入可确保 Runtime 或 Desktop 任一步失败时，上游监控仍会再次触发该版本。
          git pull --ff-only origin main
          printf '%s\n' "${{ needs.build-and-verify.outputs.harness_version }}" > runtime/.known-version
          if [[ -n "$(git status --porcelain runtime/.known-version)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add runtime/.known-version
            git commit -m "chore(runtime): confirm Harness ${{ needs.build-and-verify.outputs.harness_version }}"
            git push
          fi
