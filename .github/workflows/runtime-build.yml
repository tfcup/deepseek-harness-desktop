# Runtime 构建 + Compatibility Gate（设计文档 §8 / §11 / §12）：固定 Harness 版本、
# 捆绑 Extension Pack、构建 zip、验证、发布 dev channel + GitHub Release（tag runtime-<v>）
name: runtime-build

on:
  workflow_dispatch:
    inputs:
      harness_version:
        description: "@deepseek-ai/dsh 版本（如 0.1.0-rc.6，留空则安装 latest）"
        required: false
        default: ""
      channel:
        description: "发布通道"
        required: false
        default: "dev"
        type: choice
        options: [dev, beta, stable]

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: macos-14
    steps:
      # v5 系列使用 Node 24，避免后续 Runtime 构建继续出现 Node 20 弃用警告。
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 固定 @deepseek-ai/dsh 版本并安装到基座
        run: |
          # 基座装到 RUNNER_TEMP（仓库外）。用 npm：原生跑 postinstall、真实目录布局、
          # runtime zip 更小（pnpm 布局会得到 ~450MB 且依赖符号链接，zip 默认跟随链接膨胀）
          mkdir -p "$RUNNER_TEMP/dsh-base"
          cd "$RUNNER_TEMP/dsh-base"
          echo '{"name":"dsh-base","private":true,"dependencies":{"@deepseek-ai/dsh":"${{ inputs.harness_version || 'latest' }}"}}' > package.json
          npm install --no-audit --no-fund
          echo "DSH_BASE_DIR=$RUNNER_TEMP/dsh-base" >> "$GITHUB_ENV"

      - name: 构建 Runtime（zip + sha256 + manifest）
        run: |
          OUT=$(node runtime/scripts/build-runtime.ts --channel ${{ inputs.channel }} --dsh-base "$DSH_BASE_DIR")
          echo "$OUT"
          echo "STAGING_DIR=$(echo "$OUT" | grep '^STAGING=' | cut -d= -f2)" >> "$GITHUB_ENV"
          VERSION=$(echo "$OUT" | grep '^\[build\] runtimeVersion=' | sed -E 's/.*runtimeVersion=([0-9.]+).*/\1/')
          HARNESS_VERSION=$(echo "$OUT" | sed -nE 's/^\[build\] harness=([^ ]+).*/\1/p' | head -1)
          if [[ -z "$HARNESS_VERSION" ]]; then
            echo "无法从构建输出解析 Harness 版本" >&2
            exit 1
          fi
          echo "RUNTIME_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "HARNESS_VERSION=$HARNESS_VERSION" >> "$GITHUB_ENV"

      - name: Compatibility Gate（全新 DSH_HOME：扩展加载 → 启动 → 引导图 → client.js）
        run: node runtime/scripts/verify-runtime.ts --runtime "$STAGING_DIR"

      - name: 上传产物（zip + sha256 + manifest）
        uses: actions/upload-artifact@v4
        with:
          name: runtime-dist
          path: |
            runtime/dist/*.zip
            runtime/dist/*.sha256
            runtime/dist/manifest-*.json
          retention-days: 14

      - name: 发布到 channel（updater/channels/<channel>.json）
        run: |
          MANIFEST=$(ls runtime/dist/manifest-*.json | head -1)
          node runtime/scripts/publish-runtime.ts --channel ${{ inputs.channel }} --manifest "$MANIFEST"
          # 仅在 Compatibility Gate 与发布均成功后推进已知版本；失败构建会在下次定时任务重试。
          printf '%s\n' "$HARNESS_VERSION" > runtime/.known-version
          if [[ -n "$(git status --porcelain updater/channels runtime/.known-version)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add updater/channels runtime/.known-version
            git commit -m "chore(updater): publish ${{ inputs.channel }} channel runtime ${{ env.RUNTIME_VERSION }}"
            git push
          fi

      - name: 创建 GitHub Release（tag runtime-${{ env.RUNTIME_VERSION }}）
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime-${{ env.RUNTIME_VERSION }}
          name: "Harness Runtime ${{ env.RUNTIME_VERSION }}"
          files: |
            runtime/dist/*.zip
            runtime/dist/*.sha256
            runtime/dist/manifest-*.json
          draft: false
          prerelease: ${{ inputs.channel != 'stable' }}
