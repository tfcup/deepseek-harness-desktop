# 上游检查（设计文档 §10）：每小时检查 @deepseek-ai/dsh 新版本，有新版触发 runtime-build
name: upstream-watch

on:
  schedule:
    - cron: "17 * * * *" # 每小时第 17 分钟
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    outputs:
      upstream_version: ${{ steps.detect.outputs.upstream_version }}
      upstream_changed: ${{ steps.detect.outputs.upstream_changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 检测上游新版本
        id: detect
        run: node runtime/scripts/detect-upstream.ts

      - name: 有新版 → 触发 runtime-build
        if: steps.detect.outputs.upstream_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'runtime-build.yml',
              ref: 'main',
              inputs: {
                harness_version: '${{ steps.detect.outputs.upstream_version }}',
                channel: 'dev',
              },
            })
            console.log('dispatched runtime-build for', '${{ steps.detect.outputs.upstream_version }}')
